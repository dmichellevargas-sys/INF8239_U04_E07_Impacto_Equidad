purpose: "Ordenar casos territoriales sintéticos para que un equipo humano decida a cuáles revisar primero; el modelo no decide intervenciones."
assisted_decision: "Prioridad de revisión técnica de un caso (alta o normal). La persona revisora decide si se interviene."
users: "Analistas territoriales que operan la cola de revisión y su supervisor."
affected_population: "Comunidades y hogares de las zonas Norte, Sur, Este y Oeste representados en los casos; en especial los grupos G1 y G2 y las franjas de edad."
owner: "Product Owner del DSS (A en la matriz RACI), con supervisión del responsable institucional."
non_predictive_alternative: "Revisión por orden de llegada con criterios fijos (incidentes previos >= 3 o infraestructura < 0.4) aplicados por la persona analista."
out_of_scope_use: "Intervención automática, decisión de elegibilidad, declaratoria de emergencia, perfilado de personas reales o cualquier uso con datos reales sin una nueva evaluación de impacto."
withdrawal_condition: "Retirar o volver a la alternativa no predictiva si el recall de cualquier grupo cae por debajo de 0.60, si la brecha de recall o de FPR supera 0.16 en dos revisiones mensuales seguidas, o ante cualquier incidente de daño confirmado."
appeal_mechanism: "Toda persona o comunidad puede solicitar revisión humana prioritaria por el canal institucional; la solicitud se registra y un revisor distinto responde en un plazo máximo de 10 días hábiles."
