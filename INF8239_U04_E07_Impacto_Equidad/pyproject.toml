[project]
name = "inf8239-u04-governance-dss"
version = "0.1.0"
description = "Laboratorios de impacto, equidad y DSS gobernado"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fairlearn>=0.12,<0.13", "joblib>=1.5,<2", "numpy>=2.0,<3",
  "pandas>=2.2,<3", "plotly>=6,<7", "pyyaml>=6,<7",
  "scikit-learn>=1.7,<2", "streamlit>=1.49,<2"
]
[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.13,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_u04"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
